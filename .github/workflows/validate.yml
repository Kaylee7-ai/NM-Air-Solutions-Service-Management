name: Validate service desk

on:
  push:
    branches:
      - feature/cloudflare-production-service-desk
  pull_request:
    branches:
      - main

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check Worker JavaScript syntax
        run: node --check worker/index.js
      - name: Smoke test deployed Cloudflare API\n        run: |\n          curl --fail --silent --show-error https://nm-air-service-api.nm-air-solutions-service.workers.dev/health\n          curl --fail --silent --show-error https://nm-air-service-api.nm-air-solutions-service.workers.dev/api/setup-status\n      - name: Extract and check website JavaScript
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const html = fs.readFileSync('index.html', 'utf8');
          const match = html.match(/<script>([\s\S]*?)<\/script>/);
          if (!match) throw new Error('Inline application script was not found.');
          fs.writeFileSync('/tmp/site.js', match[1]);
          NODE
          node --check /tmp/site.js
